version: "3.8"

services:
  # MySQL 8 Database Service
  database:
    image: mysql:8.0
    container_name: voyagepilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voyagepilot_db}
      MYSQL_USER: ${MYSQL_USER:-voyage_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voyage_secure_pwd_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secret_456}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - voyagepilot-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voyagepilot-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-voyagepilot_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-voyage_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-voyage_secure_pwd_123}
      JWT_SECRET: ${JWT_SECRET:-voyagepilot_production_jwt_secret_key_minimum_256_bits_for_hmac_sha256_security}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - voyagepilot-net

  # React Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: voyagepilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - voyagepilot-net

volumes:
  mysql_data:
    driver: local

networks:
  voyagepilot-net:
    driver: bridge
